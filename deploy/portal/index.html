<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ardiwnsha Apps</title>
<style>
  :root {
    --bg: #0b1119;
    --panel: #141d28;
    --border: #29394a;
    --text: #e9eff4;
    --muted: #8fa2b3;
    --accent: #25d366;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #16202c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.tagline { color: var(--muted); margin: 0 0 40px; font-size: 14px; }
  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 720px;
  }
  a.app-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.15s ease;
  }
  a.app-card:hover { border-color: var(--accent); }
  .app-icon { font-size: 28px; }
  .app-name { font-weight: 600; font-size: 15px; }
  .app-desc { color: var(--muted); font-size: 13px; line-height: 1.4; }
  .app-card.placeholder {
    opacity: 0.5;
    cursor: default;
  }
  .app-card.placeholder:hover { border-color: var(--border); }
  footer { margin-top: 60px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <h1>Ardiwnsha Apps</h1>
  <p class="tagline">Personal tools and dashboards</p>

  <div class="apps">
    <a class="app-card" href="https://watcher.apps.ardiwnsha.in">
      <span class="app-icon">🏠</span>
      <span class="app-name">Dublin Accommodation Watcher</span>
      <span class="app-desc">Real-time WhatsApp group monitoring for room listings.</span>
    </a>

    <div class="app-card placeholder">
      <span class="app-icon">➕</span>
      <span class="app-name">More apps coming soon</span>
      <span class="app-desc">New apps get added here as they're built.</span>
    </div>
  </div>

  <footer>Developed by Ardiwnsha</footer>
</body>
</html>
