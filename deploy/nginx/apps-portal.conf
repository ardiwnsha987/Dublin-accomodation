# nginx server block for the apps.ardiwnsha.in portal page.
# Copy to /etc/nginx/sites-available/apps-portal.conf on the VPS, then:
#   sudo ln -s /etc/nginx/sites-available/apps-portal.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards to add HTTPS (see deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name apps.ardiwnsha.in;

    root /var/www/apps-portal;
    index index.html;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }
}
