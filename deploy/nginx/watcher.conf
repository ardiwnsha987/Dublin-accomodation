# nginx server block for watcher.apps.ardiwnsha.in, proxying to the
# accommodation watcher's Node process (127.0.0.1:3000).
#
# Copy to /etc/nginx/sites-available/watcher.conf on the VPS, then:
#   sudo ln -s /etc/nginx/sites-available/watcher.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards to add HTTPS (see deploy/README.md).
#
# This is also the template for adding future apps: copy this file, change
# server_name and the proxy_pass port, done.

server {
    listen 80;
    listen [::]:80;
    server_name watcher.apps.ardiwnsha.in;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the dashboard's live-updates stream (Server-Sent
        # Events) to work through the proxy instead of hanging/buffering.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
